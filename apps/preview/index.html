<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>KZ Studio — Prévisualisation</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #06080c;
        color: #8b97ab;
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 20px;
        min-height: 100vh;
      }
      /*
       * On empile EXACTEMENT comme OBS le fera :
       *   couche bg (le plateau)  →  ta webcam  →  couche fg
       *
       * Il n'y a RIEN derrière : un watchalong ne diffuse jamais les images du
       * match. La case centrale est la caméra, et le plateau raconte la
       * rencontre par la donnée.
       *
       * En mode caméra « navigateur », l'overlay capture lui-même la webcam et
       * la place dans la couche bg — c'est ce que montre cette page. En mode
       * « OBS », c'est ta vraie source caméra qui vient se loger ici, animée
       * par la régie.
       */
      .tv {
        position: relative;
        width: min(96vw, 1920px);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
        background: #05070e;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        border: 0;
        transform-origin: top left;
        background: transparent;
      }
      .bar { display: flex; gap: 10px; align-items: center; font-size: 13px; }
      a { color: #e8b058; }
    </style>
  </head>
  <body>
    <div class="tv" id="tv">
      <iframe id="bg" src="/overlay/?layer=bg" allow="camera"></iframe>
      <iframe id="fg" src="/overlay/?layer=fg" allow="camera"></iframe>
    </div>
    <div class="bar">
      Empilement réel d'OBS — couche bg (plateau + webcam), puis couche fg.
      <a href="/regie/">Ouvrir la régie</a>
    </div>
    <script>
      // Les iframes font 1920×1080 ; on les met à l'échelle du cadre.
      const tv = document.getElementById('tv');
      function fit() {
        const scale = tv.clientWidth / 1920;
        for (const frame of document.querySelectorAll('iframe')) {
          frame.style.transform = `scale(${scale})`;
        }
      }
      new ResizeObserver(fit).observe(tv);
      fit();
    </script>
  </body>
</html>
