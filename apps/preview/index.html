<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KZ Studio — Prévisualisation</title>
    <style>
      /*
       * La page de test.
       *
       * Elle empile exactement comme OBS — couche bg, ta webcam, couche fg —
       * et rien d'autre. En plein écran, la barre s'efface : on regarde
       * l'habillage, pas l'outil qui l'affiche.
       */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        color-scheme: dark;
        --bg: #06080c;
        --surface: #11141d;
        --line: #242b3a;
        --ink: #eef2f8;
        --soft: #97a1b5;
        --dim: #5f6a80;
        --accent: #e8b45c;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Archivo', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }

      /* Le plateau. En plein écran il prend tout, sans marge ni bordure. */
      .tv {
        position: relative;
        width: min(100%, calc((100vh - 150px) * 16 / 9));
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 10px;
        background: #05070e;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7);
      }

      .tv iframe {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        border: 0;
        transform-origin: top left;
        background: transparent;
      }

      /* ── Barre de contrôle ─────────────────────────────────────────────── */

      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 1400px);
        padding: 10px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        transition: opacity 260ms ease;
      }

      .group { display: flex; align-items: center; gap: 6px; }

      .group__label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        margin-right: 2px;
      }

      button {
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--soft);
        background: #181d29;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
        transition: border-color 140ms ease, color 140ms ease, background 140ms ease;
      }

      button:hover { border-color: #39435a; color: var(--ink); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button[data-on='1'] { background: var(--accent); border-color: var(--accent); color: #15181f; font-weight: 700; }
      button.wide { min-width: 108px; }

      .readout {
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        min-width: 120px;
        text-align: right;
      }

      .hint { font-size: 11.5px; color: var(--dim); text-align: center; }
      kbd {
        display: inline-block;
        min-width: 16px;
        padding: 1px 4px;
        border: 1px solid #39435a;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #181d29;
        font-family: inherit;
        font-size: 10.5px;
        color: var(--soft);
      }

      /* ── Plein écran ───────────────────────────────────────────────────── */

      body:fullscreen,
      body:-webkit-full-screen { padding: 0; gap: 0; justify-content: center; background: #000; }

      body:fullscreen .tv {
        width: 100vw;
        height: 100vh;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
      }

      body:fullscreen .hint { display: none; }

      /* La barre flotte au-dessus et s'efface quand la souris se tient
         tranquille : on regarde l'antenne, pas les boutons. */
      body:fullscreen .bar {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(10, 13, 20, 0.92);
        backdrop-filter: blur(8px);
      }

      body:fullscreen.repos .bar { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- L'empilement d'OBS : couche bg (plateau + webcam), puis couche fg.
         Il n'y a rien derrière — un watchalong ne diffuse jamais le match. -->
    <div class="tv" id="tv">
      <iframe id="bg" src="/overlay/?layer=bg" allow="camera"></iframe>
      <iframe id="fg" src="/overlay/?layer=fg" allow="camera"></iframe>
    </div>

    <div class="bar" id="bar">
      <div class="group" id="scenes"><span class="group__label">Scènes</span></div>

      <div class="group">
        <span class="group__label">Délai</span>
        <button data-nudge="-1000">−1 s</button>
        <span class="readout" id="delai">—</span>
        <button data-nudge="1000">+1 s</button>
      </div>

      <div class="group">
        <span class="group__label">Inserts</span>
        <button class="wide" id="inserts">—</button>
      </div>

      <div class="group">
        <span class="group__label">Vitesse</span>
        <button data-speed="1">x1</button>
        <button data-speed="6">x6</button>
        <button data-speed="20">x20</button>
      </div>

      <div class="group">
        <button id="plein">Plein écran</button>
      </div>
    </div>

    <p class="hint">
      <kbd>F</kbd> plein écran · <kbd>1</kbd>…<kbd>8</kbd> scènes ·
      <kbd>←</kbd><kbd>→</kbd> délai · <kbd>I</kbd> inserts · <kbd>Échap</kbd> sortir
    </p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
